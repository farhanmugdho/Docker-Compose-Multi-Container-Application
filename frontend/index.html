<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Container Notes App</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;background:#f5f7fa;color:#1f2933}
  h1{margin-bottom:4px} .sub{color:#52606d;margin-top:0}
  .card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.1);margin:16px 0}
  input{width:70%;padding:8px;border:1px solid #cbd2d9;border-radius:6px}
  button{padding:8px 14px;border:0;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer}
  li{padding:6px 0;border-bottom:1px solid #e4e7eb}
  .ok{color:#15803d}.bad{color:#b91c1c}
</style>
</head>
<body>
<h1>Multi-Container Notes App</h1>
<p class="sub">Frontend (Nginx) &rarr; Backend (Flask) &rarr; Database (PostgreSQL)</p>

<div class="card">Backend status: <b id="status">checking...</b></div>

<div class="card">
  <input id="note" placeholder="Write a note...">
  <button onclick="addNote()">Save</button>
  <ul id="list"></ul>
</div>

<script>
async function health(){
  const s=document.getElementById('status');
  try{const r=await fetch('/api/health');const d=await r.json();
    s.textContent='OK - database: '+d.database;s.className='ok';}
  catch(e){s.textContent='unreachable';s.className='bad';}
}
async function load(){
  const r=await fetch('/api/notes');const d=await r.json();
  document.getElementById('list').innerHTML=d.map(n=>'<li>'+n.text.replace(/</g,'&lt;')+'</li>').join('');
}
async function addNote(){
  const i=document.getElementById('note');if(!i.value.trim())return;
  await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:i.value})});
  i.value='';load();
}
health();load();
</script>
</body>
</html>
